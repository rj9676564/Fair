name: fair_example
version: 0.0.1+1
description: Demonstrates how to use the fair plugin.

publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  convex_bottom_bar: ^3.0.0
  flutter_redux: ^0.9.0
  fair:
    path: ../
  dio: ^4.0.0
  permission_handler: 6.0.1
  image_picker: ^0.8.4+1
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  fair_compiler:
    path: ../../compiler

dependency_overrides:
   fair_version:
     path: ../../flutter_version/flutter_3_41_0
   collection: ^1.18.0
   meta: ^1.18.0
   analyzer: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bundle/
    - assets/image/
    - assets/
    - assets/plugin/